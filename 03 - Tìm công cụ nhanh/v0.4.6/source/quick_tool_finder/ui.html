<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tìm Công Cụ Nhanh v0.4.6</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f9;
    --panel: #ffffff;
    --panel-2: #f8fafc;
    --text: #172033;
    --muted: #758096;
    --line: #e2e7ef;
    --accent: #2563eb;
    --accent-soft: rgba(37,99,235,.10);
    --accent-line: rgba(37,99,235,.28);
    --success: #16835c;
    --shadow: 0 8px 26px rgba(24,34,55,.08);
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181e;
      --panel: #1d2129;
      --panel-2: #242932;
      --text: #eef2f7;
      --muted: #98a2b3;
      --line: #343b47;
      --accent: #69a2ff;
      --accent-soft: rgba(105,162,255,.12);
      --accent-line: rgba(105,162,255,.30);
      --success: #55c99a;
      --shadow: 0 10px 28px rgba(0,0,0,.22);
    }
  }

  :root {
    color-scheme: dark;
    --bg: #000000;
    --panel: #050505;
    --panel-2: #0b0b0b;
    --text: #f2f4f7;
    --muted: #9299a6;
    --line: #20242b;
    --accent: #6ea8ff;
    --accent-soft: rgba(110,168,255,.12);
    --accent-line: rgba(110,168,255,.32);
    --success: #66d7a7;
    --danger: #ff7b7b;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 13px;
  }
  button, input { font: inherit; }
  button { color: inherit; }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--bg);
  }

  .header {
    padding: 14px 14px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(0,0,0,.02);
    z-index: 2;
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 11px;
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand-icon {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border-radius: 9px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 18px;
    font-weight: 700;
  }
  .brand-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700; line-height: 1;
  }
  .version {
    padding: 3px 7px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .2px;
  }
  .brand-sub { margin-top: 4px; color: var(--muted); font-size: 11px; }

  .top-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .tool-btn {
    height: 32px;
    min-width: 32px;
    padding: 0 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--panel-2);
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, transform .08s ease;
  }
  .tool-btn:hover { background: var(--accent-soft); border-color: var(--accent-line); }
  .tool-btn:active { transform: translateY(1px); }
  .tool-btn .label { font-size: 11px; font-weight: 600; }

  .search-wrap {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .search-box {
    position: relative;
    display: flex;
    align-items: center;
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--panel-2);
    transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
  }
  .search-box:focus-within {
    border-color: var(--accent);
    background: var(--panel);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-icon { width: 38px; text-align: center; color: var(--muted); font-size: 15px; }
  #q {
    min-width: 0;
    flex: 1;
    height: 100%;
    padding: 0 4px 0 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font-size: 15px;
  }
  #q::placeholder { color: var(--muted); }
  .clear-btn {
    width: 30px; height: 30px;
    margin-right: 5px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    visibility: hidden;
  }
  .clear-btn.visible { visibility: visible; }
  .clear-btn:hover { background: var(--accent-soft); color: var(--text); }
  .refresh-btn { width: 42px; height: 42px; padding: 0; font-size: 17px; }
  .refresh-btn.spin { animation: spin .75s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 9px;
    min-height: 27px;
  }
  .chip {
    height: 27px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all .12s ease;
  }
  .chip:hover { border-color: var(--accent-line); color: var(--text); }
  .chip.active { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
  .group-select {
    height: 27px;
    max-width: 190px;
    padding: 0 26px 0 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel-2);
    color: var(--text);
    font-size: 11px;
    outline: none;
  }
  .group-select:focus { border-color: var(--accent-line); }
  .hint { margin-left: auto; color: var(--muted); font-size: 10px; white-space: nowrap; }

  .list {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 9px 10px 14px;
    scroll-behavior: smooth;
  }
  .list::-webkit-scrollbar { width: 9px; }
  .list::-webkit-scrollbar-thumb { background: rgba(120,130,145,.28); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }

  .item {
    display: grid;
    grid-template-columns: 42px minmax(0,1fr) auto;
    gap: 10px;
    align-items: center;
    min-height: 58px;
    margin-bottom: 5px;
    padding: 8px 9px 8px 11px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: transparent;
    cursor: pointer;
    transition: background .10s ease, border-color .10s ease, box-shadow .10s ease;
  }
  .item:hover { background: var(--panel); border-color: var(--line); }
  .item.active {
    background: var(--panel);
    border-color: var(--accent-line);
    box-shadow: var(--shadow);
  }
  .item.pinned { border-left: 3px solid var(--accent); padding-left: 9px; }
  .tool-icon-box {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    display: grid;
    place-items: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .tool-icon {
    width: 30px;
    height: 30px;
    object-fit: contain;
    display: block;
  }
  .tool-icon-fallback {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -.5px;
    user-select: none;
  }
  .content { min-width: 0; }
  .title-line { display: flex; align-items: center; min-width: 0; gap: 7px; }
  .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 650;
    line-height: 1.3;
  }
  .alias {
    max-width: 42%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
  }
  .badge {
    flex-shrink: 0;
    height: 19px;
    padding: 0 6px;
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--muted);
    background: var(--panel-2);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .15px;
  }
  .badge.pin { color: var(--success); }
  .badge.group { color: var(--accent); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shortcut {
    flex-shrink: 0;
    padding: 2px 6px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 700;
    background: var(--panel-2);
  }
  .meta {
    margin-top: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 10px;
  }

  .actions { display: flex; gap: 5px; opacity: .72; transition: opacity .1s ease; }
  .item:hover .actions, .item.active .actions { opacity: 1; }
  .mini {
    height: 30px;
    min-width: 30px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-2);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: background .1s ease, border-color .1s ease, transform .08s ease;
  }
  .mini:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent-line); }
  .mini:active:not(:disabled) { transform: translateY(1px); }
  .mini:disabled { opacity: .45; cursor: default; }
  .mini.pin-btn:not(:disabled), .mini.group-btn:not(:disabled) { color: var(--accent); }
  .mini.unpin-btn:not(:disabled) { color: var(--danger); }

  .empty {
    min-height: 220px;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
  }
  .empty-icon { font-size: 28px; opacity: .6; margin-bottom: 8px; }
  .empty-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .empty-sub { margin-top: 5px; font-size: 11px; }

  .footer {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 14px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-size: 10px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 6px;
  }

  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 18px;
    background: rgba(0,0,0,.72); backdrop-filter: blur(3px);
  }
  .modal-backdrop.hidden { display: none; }
  .modal-card {
    width: min(560px,100%); max-height: min(640px,88vh); overflow: hidden;
    display: grid; grid-template-rows: auto auto minmax(0,1fr) auto;
    background: #050505; border: 1px solid #252a33; border-radius: 14px;
    box-shadow: 0 24px 70px rgba(0,0,0,.62);
  }
  .modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px 10px; }
  .modal-title { font-size:15px; font-weight:750; }
  .modal-sub { margin-top:3px; color:var(--muted); font-size:11px; }
  .modal-close { width:30px; height:30px; border:1px solid var(--line); border-radius:8px; background:#0b0b0b; cursor:pointer; font-size:18px; }
  .group-create { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:0 16px 12px; }
  .group-create input, .group-rename-input { min-width:0; height:34px; padding:0 10px; border:1px solid var(--line); border-radius:8px; outline:none; background:#000; color:var(--text); }
  .group-create input:focus, .group-rename-input:focus { border-color:var(--accent-line); }
  .primary-btn { height:34px; padding:0 12px; border:1px solid var(--accent-line); border-radius:8px; background:var(--accent-soft); color:var(--accent); cursor:pointer; font-weight:650; }
  .group-list { overflow:auto; padding:0 10px 10px; }
  .group-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 8px; border-top:1px solid #16191f; }
  .group-row:first-child { border-top:0; }
  .group-main { min-width:0; }
  .group-name { font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .group-count { margin-top:2px; color:var(--muted); font-size:10px; }
  .group-actions { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .group-action { height:28px; padding:0 8px; border:1px solid var(--line); border-radius:7px; background:#0b0b0b; cursor:pointer; font-size:11px; }
  .group-action.danger { color:var(--danger); }
  .group-action.pin-state { color:var(--success); }
  .group-action.hide-state { color:var(--muted); }
  .group-state-line { margin-top:4px; display:flex; align-items:center; gap:6px; color:var(--muted); font-size:10px; }
  .group-state-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .group-state-dot.visible { background:var(--success); box-shadow:0 0 0 2px rgba(102,215,167,.12); }
  .group-action:disabled { opacity:.35; cursor:default; }
  .group-picker-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; padding:2px 16px 14px; overflow:auto; }
  .group-pick { min-height:40px; padding:8px 10px; text-align:left; cursor:pointer; border:1px solid var(--line); border-radius:9px; background:#0b0b0b; }
  .group-pick:hover { border-color:var(--accent-line); background:var(--accent-soft); }
  .modal-foot { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 16px 14px; border-top:1px solid #16191f; color:var(--muted); font-size:10px; }

  @media (max-width: 760px) {
    .tool-btn .label, .hint { display: none; }
    .brand-sub { display: none; }
    .actions .shortcut-btn { display: none; }
  }
  @media (max-width: 620px) {
    .top-actions #finderShortcut, .top-actions #showQuickTools { display: none; }
    .item { grid-template-columns: 38px minmax(0,1fr) auto; }
    .actions .alias-btn { display: none; }
    .alias { max-width: 50%; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-icon">⌕</div>
        <div>
          <div class="brand-title">Tìm Công Cụ Nhanh <span class="version">v0.4.6</span></div>
          <div class="brand-sub">Tìm, đặt tên, ghim và chạy nhanh công cụ SketchUp</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="tool-btn" id="finderShortcut" title="Đặt phím tắt mở Tìm Công Cụ Nhanh"><span>⌨</span><span class="label">Tìm</span></button>
        <button class="tool-btn" id="showQuickTools" title="Hiện thanh Quick Tools đã ghim"><span>📌</span><span class="label">Quick Tools</span></button>
        <button class="tool-btn" id="manageGroups" title="Quản lý nhóm ghim"><span>⚙</span><span class="label">Nhóm</span></button>
        <button class="tool-btn" id="showToolbar" title="Hiện icon Tìm Công Cụ Nhanh trên màn hình"><span>▣</span></button>
      </div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <div class="search-icon">⌕</div>
        <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Tìm công cụ… ví dụ: make box hoặc hình vuông">
        <button class="clear-btn" id="clear" title="Xóa tìm kiếm">×</button>
      </div>
      <button class="tool-btn refresh-btn" id="refresh" title="Quét lại công cụ">↻</button>
    </div>

    <div class="filter-row">
      <button class="chip active" data-filter="all">Tất cả</button>
      <button class="chip" data-filter="pinned">📌 Đã ghim</button>
      <button class="chip" data-filter="alias">✎ Tên gợi nhớ</button>
      <select id="groupFilter" class="group-select" title="Lọc theo nhóm ghim">
        <option value="all">Nhóm: Tất cả</option>
      </select>
      <div class="hint">↑ ↓ chọn · Enter chạy · Esc đóng</div>
    </div>
  </header>

  <main id="list" class="list"></main>

  <footer class="footer">
    <span><span class="status-dot"></span><span id="count">0 công cụ</span></span>
    <span id="pinStats">0 ghim · 0 nhóm</span>
  </footer>
</div>
<div id="groupModal" class="modal-backdrop hidden" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <div><div id="groupModalTitle" class="modal-title">Quản lý nhóm ghim</div><div id="groupModalSub" class="modal-sub">Tạo, đổi tên hoặc xóa nhóm.</div></div>
      <button id="groupModalClose" class="modal-close" title="Đóng">×</button>
    </div>
    <div id="groupCreate" class="group-create">
      <input id="groupNameInput" type="text" autocomplete="off" spellcheck="false" placeholder="Tên nhóm mới…">
      <button id="groupCreateBtn" class="primary-btn">+ Thêm nhóm</button>
    </div>
    <div id="groupModalBody" class="group-list"></div>
    <div class="modal-foot"><span>Ẩn nhóm không xóa ghim; trạng thái được giữ sau khi mở lại SketchUp.</span><span>v0.4.6</span></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  let commands = [];
  let filtered = [];
  let activeIndex = 0;
  let filterMode = 'all';
  let groupMode = 'all';
  let inputTimer = 0;
  let renderFrame = 0;
  let groups = ['Chưa phân loại'];
  let groupStates = Object.create(null);
  let groupModalMode = 'manage';
  let groupModalTool = null;
  let renameGroupName = '';

  const q = document.getElementById('q');
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  const clearBtn = document.getElementById('clear');
  const refreshBtn = document.getElementById('refresh');
  const groupFilter = document.getElementById('groupFilter');
  const pinStats = document.getElementById('pinStats');
  const chips = Array.from(document.querySelectorAll('.chip'));
  const groupModal = document.getElementById('groupModal');
  const groupModalTitle = document.getElementById('groupModalTitle');
  const groupModalSub = document.getElementById('groupModalSub');
  const groupModalBody = document.getElementById('groupModalBody');
  const groupCreate = document.getElementById('groupCreate');
  const groupNameInput = document.getElementById('groupNameInput');
  const groupCreateBtn = document.getElementById('groupCreateBtn');

  function normalize(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function prepare(c) {
    c._alias = normalize(c.alias);
    c._name = normalize(c.name);
    c._group = normalize(c.pin_group);
    c._search = normalize([c.alias, c.name, c.pin_group, c.tooltip, c.status, c.extension, c.source, c.toolbar].join(' '));
    return c;
  }

  function score(c, query) {
    const pinBoost = c.pinned ? 30 : 0;
    if (!query) return (c.alias ? 20 : 0) + pinBoost;
    const alias = c._alias;
    const name = c._name;
    const all = c._search;
    if (alias && alias === query) return 1300 + pinBoost;
    if (alias && alias.startsWith(query)) return 1150 - alias.length + pinBoost;
    if (alias && alias.indexOf(query) >= 0) return 1050 - alias.indexOf(query) + pinBoost;
    if (name === query) return 1000 + pinBoost;
    if (name.startsWith(query)) return 850 - name.length + pinBoost;
    const words = name.split(/\s+/);
    for (let i = 0; i < words.length; i++) {
      if (words[i].startsWith(query)) return 700 - i + pinBoost;
    }
    const pos = name.indexOf(query);
    if (pos >= 0) return 600 - pos + pinBoost;
    const allPos = all.indexOf(query);
    if (allPos >= 0) return 400 - allPos + pinBoost;

    let qi = 0;
    let gap = 0;
    for (let i = 0; i < name.length && qi < query.length; i++) {
      if (name[i] === query[qi]) qi++;
      else if (qi > 0) gap++;
    }
    return qi === query.length ? 200 - gap + pinBoost : -1;
  }

  function passesFilter(c) {
    if (filterMode === 'pinned' && !c.pinned) return false;
    if (filterMode === 'alias' && !c.alias) return false;
    if (groupMode !== 'all' && normalize(c.pin_group) !== groupMode) return false;
    return true;
  }

  function groupCounts() {
    const counts = new Map();
    for (const c of commands) {
      if (!c.pinned) continue;
      const group = String(c.pin_group || 'Chưa phân loại');
      counts.set(group, (counts.get(group) || 0) + 1);
    }
    return counts;
  }

  function rebuildGroupFilter() {
    const previous = groupMode;
    const counts = groupCounts();
    const names = Array.from(new Set(['Chưa phân loại', ...groups, ...counts.keys()]));
    names.sort((a,b) => a === 'Chưa phân loại' ? -1 : b === 'Chưa phân loại' ? 1 : a.localeCompare(b,'vi'));
    groupFilter.innerHTML = '<option value="all">Nhóm: Tất cả</option>' + names.map(group => {
      const value = normalize(group);
      return `<option value="${escapeHtml(value)}">${escapeHtml(group)} (${counts.get(group) || 0})</option>`;
    }).join('');
    const exists = Array.from(groupFilter.options).some(opt => opt.value === previous);
    groupMode = exists ? previous : 'all';
    groupFilter.value = groupMode;
    let totalPins = 0;
    for (const n of counts.values()) totalPins += n;
    pinStats.textContent = `${totalPins} ghim · ${names.length} nhóm`;
  }

  function scheduleRender(delay = 0) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      if (renderFrame) cancelAnimationFrame(renderFrame);
      renderFrame = requestAnimationFrame(filterAndRender);
    }, delay);
  }

  function filterAndRender() {
    renderFrame = 0;
    const query = normalize(q.value.trim());
    const ranked = [];

    for (let i = 0; i < commands.length; i++) {
      const c = commands[i];
      if (!passesFilter(c)) continue;
      const s = score(c, query);
      if (!query || s >= 0) ranked.push([s, c]);
    }

    ranked.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name));

    filtered = ranked.slice(0, 100).map(item => item[1]);
    activeIndex = filtered.length ? Math.min(activeIndex, filtered.length - 1) : 0;
    renderList();
  }

  function renderList() {
    if (!filtered.length) {
      list.innerHTML = '<div class="empty"><div><div class="empty-icon">⌕</div><div class="empty-title">Không tìm thấy công cụ</div><div class="empty-sub">Thử tên khác hoặc bấm ↻ để quét lại.</div></div></div>';
    } else {
      const html = new Array(filtered.length);
      for (let i = 0; i < filtered.length; i++) {
        const c = filtered[i];
        const meta = [c.extension, c.toolbar, c.tooltip].filter(Boolean).join(' · ');
        const alias = c.alias ? `<span class="alias">→ ${escapeHtml(c.alias)}</span>` : '';
        const shortcut = c.shortcut ? `<span class="shortcut">${escapeHtml(c.shortcut)}</span>` : '';
        const pinBadge = c.pinned ? '<span class="badge pin">📌 GHIM</span>' : '';
        const groupBadge = c.pinned && c.pin_group ? `<span class="badge group">${escapeHtml(c.pin_group)}</span>` : '';
        const pinActions = c.pinned
          ? `<button class="mini group-btn" data-action="editPinGroup" title="Đổi nhóm ghim">📂</button>
             <button class="mini unpin-btn" data-action="unpin" title="Gỡ ghim">−</button>`
          : '<button class="mini pin-btn" data-action="pin" title="Ghim và chọn nhóm">📌</button>';

        const initial = escapeHtml((c.alias || c.name || '?').trim().charAt(0).toUpperCase());
        const icon = c.icon_preview
          ? `<div class="tool-icon-box"><img class="tool-icon" src="${c.icon_preview}" alt="" draggable="false" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="tool-icon-fallback" style="display:none">${initial}</div></div>`
          : `<div class="tool-icon-box"><div class="tool-icon-fallback">${initial}</div></div>`;

        html[i] = `<div class="item ${i === activeIndex ? 'active' : ''} ${c.pinned ? 'pinned' : ''}" data-i="${i}">
          ${icon}
          <div class="content">
            <div class="title-line">
              <div class="name">${escapeHtml(c.name)}</div>
              ${alias}${pinBadge}${groupBadge}${shortcut}
            </div>
            <div class="meta">${escapeHtml(meta)}</div>
          </div>
          <div class="actions">
            ${pinActions}
            <button class="mini alias-btn" data-action="alias" title="Đặt tên gợi nhớ">✎</button>
            <button class="mini shortcut-btn" data-action="shortcut" title="Đặt phím tắt">⌨</button>
          </div>
        </div>`;
      }
      list.innerHTML = html.join('');
    }

    count.textContent = `${filtered.length} / ${commands.length} công cụ`;
    clearBtn.classList.toggle('visible', q.value.length > 0);
    ensureActiveVisible(false);
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function setActive(next) {
    if (!filtered.length) return;
    next = Math.max(0, Math.min(next, filtered.length - 1));
    if (next === activeIndex) return;

    const oldEl = list.querySelector(`.item[data-i="${activeIndex}"]`);
    if (oldEl) oldEl.classList.remove('active');
    activeIndex = next;
    const newEl = list.querySelector(`.item[data-i="${activeIndex}"]`);
    if (newEl) newEl.classList.add('active');
    ensureActiveVisible(true);
  }

  function ensureActiveVisible(smooth) {
    const el = list.querySelector('.item.active');
    if (!el) return;
    const top = el.offsetTop;
    const bottom = top + el.offsetHeight;
    if (top < list.scrollTop || bottom > list.scrollTop + list.clientHeight) {
      el.scrollIntoView({ block: 'nearest', behavior: smooth ? 'smooth' : 'auto' });
    }
  }

  function run(index = activeIndex) {
    const c = filtered[index];
    if (c) window.sketchup.run(c.id);
  }

  function sortedGroups() {
    const counts = groupCounts();
    const names = Array.from(new Set(['Chưa phân loại', ...groups, ...counts.keys()]));
    names.sort((a,b) => a === 'Chưa phân loại' ? -1 : b === 'Chưa phân loại' ? 1 : a.localeCompare(b,'vi'));
    return names;
  }

  function isGroupVisible(name) {
    const key = normalize(name);
    return Object.prototype.hasOwnProperty.call(groupStates, key) ? !!groupStates[key] : true;
  }

  function showGroupModal() { groupModal.classList.remove('hidden'); groupModal.setAttribute('aria-hidden','false'); }
  function closeGroupModal() { groupModal.classList.add('hidden'); groupModal.setAttribute('aria-hidden','true'); groupModalTool=null; renameGroupName=''; q.focus(); }

  function openGroupManager() {
    groupModalMode='manage'; groupModalTool=null; renameGroupName='';
    groupModalTitle.textContent='Quản lý nhóm ghim';
    groupModalSub.textContent='Ghim/ẩn từng nhóm, tạo nhóm mới, đổi tên hoặc xóa nhóm.';
    groupCreate.style.display='grid'; groupNameInput.value=''; groupCreateBtn.textContent='+ Thêm nhóm';
    renderGroupManager(); showGroupModal(); setTimeout(() => groupNameInput.focus(),20);
  }

  function renderGroupManager() {
    const counts=groupCounts();
    groupModalBody.className='group-list';
    groupModalBody.innerHTML=sortedGroups().map(name => {
      const n=counts.get(name)||0; const system=name==='Chưa phân loại';
      if (renameGroupName===name) return `<div class="group-row" data-group="${escapeHtml(name)}"><div class="group-main"><input class="group-rename-input" data-role="renameInput" value="${escapeHtml(name)}"></div><div class="group-actions"><button class="group-action" data-group-action="saveRename">Lưu</button><button class="group-action" data-group-action="cancelRename">Hủy</button></div></div>`;
      const visible=isGroupVisible(name);
      const stateText=visible?'Đang ghim trên màn hình':'Đang ẩn khỏi màn hình';
      const stateButton=visible
        ? `<button class="group-action hide-state" data-group-action="hide">🙈 Ẩn</button>`
        : `<button class="group-action pin-state" data-group-action="show">📌 Ghim</button>`;
      return `<div class="group-row" data-group="${escapeHtml(name)}"><div class="group-main"><div class="group-name">${escapeHtml(name)}</div><div class="group-count">${n} công cụ đã ghim</div><div class="group-state-line"><span class="group-state-dot ${visible?'visible':''}"></span>${stateText}</div></div><div class="group-actions">${stateButton}<button class="group-action" data-group-action="rename" ${system?'disabled':''}>✎ Đổi tên</button><button class="group-action danger" data-group-action="delete" ${system?'disabled':''}>🗑 Xóa</button></div></div>`;
    }).join('');
    const input=groupModalBody.querySelector('[data-role="renameInput"]'); if(input){input.focus();input.select();}
  }

  function openGroupPicker(c, mode) {
    groupModalMode=mode; groupModalTool=c; renameGroupName='';
    groupModalTitle.textContent=mode==='pin'?'Ghim vào nhóm':'Chuyển nhóm ghim';
    groupModalSub.textContent=c.alias||c.name;
    groupCreate.style.display='grid'; groupNameInput.value=''; groupCreateBtn.textContent='+ Nhóm mới & chọn';
    renderGroupPicker(); showGroupModal();
  }

  function renderGroupPicker() {
    const counts=groupCounts(); groupModalBody.className='group-picker-list';
    groupModalBody.innerHTML=sortedGroups().map(name => {
      const current=groupModalTool && normalize(groupModalTool.pin_group)===normalize(name);
      return `<button class="group-pick" data-pick-group="${escapeHtml(name)}" ${current?'disabled':''}><strong>${escapeHtml(name)}</strong><br><span class="group-count">${counts.get(name)||0} ghim${current?' · hiện tại':''}</span></button>`;
    }).join('');
  }

  function chooseGroup(name) {
    if(!groupModalTool)return;
    const payload=JSON.stringify({key:groupModalTool.key,group:name});
    if(groupModalMode==='pin') window.sketchup.pinToGroup(payload); else window.sketchup.movePinGroup(payload);
    closeGroupModal();
  }

  function submitGroupCreate() {
    const name=groupNameInput.value.trim(); if(!name)return;
    window.sketchup.groupAction(JSON.stringify({action:'create',name}));
    if(groupModalMode==='manage'){ groupNameInput.value=''; } else { chooseGroup(name); }
  }

  function sendRename(oldName,newName) {
    const value=String(newName||'').trim();
    if(!value||value===oldName){renameGroupName='';renderGroupManager();return;}
    window.sketchup.groupAction(JSON.stringify({action:'rename',old_name:oldName,new_name:value}));
    renameGroupName='';
  }

  q.addEventListener('input', () => {
    activeIndex = 0;
    clearBtn.classList.toggle('visible', q.value.length > 0);
    scheduleRender(45);
  });

  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); run(); }
    else if (e.key === 'Escape') { e.preventDefault(); if (!groupModal.classList.contains('hidden')) closeGroupModal(); else window.close(); }
  });

  clearBtn.addEventListener('click', () => {
    q.value = '';
    activeIndex = 0;
    scheduleRender();
    q.focus();
  });

  chips.forEach(chip => chip.addEventListener('click', () => {
    filterMode = chip.dataset.filter || 'all';
    chips.forEach(x => x.classList.toggle('active', x === chip));
    activeIndex = 0;
    scheduleRender();
    q.focus();
  }));


  groupFilter.addEventListener('change', () => {
    groupMode = groupFilter.value || 'all';
    activeIndex = 0;
    scheduleRender();
    q.focus();
  });

  list.addEventListener('mousemove', e => {
    const item = e.target.closest('.item');
    if (!item) return;
    const i = Number(item.dataset.i);
    if (Number.isInteger(i) && i !== activeIndex) setActive(i);
  });

  list.addEventListener('click', e => {
    const item = e.target.closest('.item');
    if (!item) return;
    const i = Number(item.dataset.i);
    const c = filtered[i];
    if (!c) return;
    const button = e.target.closest('button');
    const action = button && button.dataset.action;
    if (action === 'pin') { e.stopPropagation(); openGroupPicker(c, 'pin'); return; }
    if (action === 'unpin') { e.stopPropagation(); window.sketchup.unpin(c.key); return; }
    if (action === 'editPinGroup') { e.stopPropagation(); openGroupPicker(c, 'move'); return; }
    if (action === 'alias') { e.stopPropagation(); window.sketchup.editAlias(c.key); return; }
    if (action === 'shortcut') { e.stopPropagation(); window.sketchup.shortcut(c.key); return; }
    if (!button) run(i);
  });

  document.getElementById('manageGroups').addEventListener('click', openGroupManager);
  document.getElementById('groupModalClose').addEventListener('click', closeGroupModal);
  groupModal.addEventListener('click', e => { if (e.target===groupModal) closeGroupModal(); });
  groupCreateBtn.addEventListener('click', submitGroupCreate);
  groupNameInput.addEventListener('keydown', e => {
    if(e.key==='Enter'){e.preventDefault();submitGroupCreate();}
    else if(e.key==='Escape'){e.preventDefault();closeGroupModal();}
  });
  groupModalBody.addEventListener('click', e => {
    const pick=e.target.closest('[data-pick-group]'); if(pick){chooseGroup(pick.dataset.pickGroup);return;}
    const row=e.target.closest('[data-group]'); const action=e.target.closest('[data-group-action]'); if(!row||!action)return;
    const name=row.dataset.group; const kind=action.dataset.groupAction;
    if(kind==='show'){window.sketchup.groupAction(JSON.stringify({action:'show',name}));return;}
    if(kind==='hide'){window.sketchup.groupAction(JSON.stringify({action:'hide',name}));return;}
    if(kind==='rename'){renameGroupName=name;renderGroupManager();return;}
    if(kind==='cancelRename'){renameGroupName='';renderGroupManager();return;}
    if(kind==='saveRename'){const input=row.querySelector('[data-role="renameInput"]');sendRename(name,input&&input.value);return;}
    if(kind==='delete' && window.confirm(`Xóa nhóm "${name}"? Các ghim trong nhóm sẽ chuyển sang "Chưa phân loại".`)){window.sketchup.groupAction(JSON.stringify({action:'delete',name}));}
  });
  groupModalBody.addEventListener('keydown', e => {
    if(e.key==='Enter' && e.target.matches('[data-role="renameInput"]')){e.preventDefault();const row=e.target.closest('[data-group]');if(row)sendRename(row.dataset.group,e.target.value);}
    else if(e.key==='Escape' && renameGroupName){e.preventDefault();renameGroupName='';renderGroupManager();}
  });

  refreshBtn.addEventListener('click', () => {
    refreshBtn.classList.add('spin');
    window.sketchup.refresh();
  });
  document.getElementById('finderShortcut').addEventListener('click', () => window.sketchup.finderShortcut());
  document.getElementById('showToolbar').addEventListener('click', () => window.sketchup.showToolbar());
  document.getElementById('showQuickTools').addEventListener('click', () => window.sketchup.showQuickTools());

  window.setCommands = data => {
    commands = (data || []).map(prepare);
    rebuildGroupFilter();
    activeIndex = 0;
    refreshBtn.classList.remove('spin');
    filterAndRender();
    if(!groupModal.classList.contains('hidden')){ if(groupModalMode==='manage')renderGroupManager(); else renderGroupPicker(); }
    q.focus();
  };

  window.setGroups = data => {
    groups = Array.isArray(data) && data.length ? data.map(String) : ['Chưa phân loại'];
    rebuildGroupFilter();
    if(!groupModal.classList.contains('hidden')){ if(groupModalMode==='manage')renderGroupManager(); else renderGroupPicker(); }
  };

  window.setGroupStates = data => {
    groupStates = Object.create(null);
    (Array.isArray(data) ? data : []).forEach(item => {
      if(!item || !item.name) return;
      groupStates[normalize(item.name)] = item.visible !== false;
    });
    if(!groupModal.classList.contains('hidden') && groupModalMode==='manage') renderGroupManager();
  };

  window.addEventListener('load', () => window.sketchup.ready());
})();
</script>
</body>
</html>
