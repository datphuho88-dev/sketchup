name: Build Dọn Plugin VADA v1.4.1

on:
  push:
    branches: [main]
    paths:
      - '.release_tmp/v1.4.1/**'
      - '.github/workflows/build-vada-don-plugin-v1.4.1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .release_tmp/v1.4.1/source.zip.b64.part1 ]; then
            echo "No release chunks; nothing to do."
            exit 0
          fi

          OUT="02 - Dọn plugin rác/v1.4.1"
          mkdir -p "$OUT" /tmp/vada141

          cat .release_tmp/v1.4.1/source.zip.b64.part* | base64 -d > "$OUT/VADA_Don_Plugin_v1.4.1_source.zip"
          unzip -q "$OUT/VADA_Don_Plugin_v1.4.1_source.zip" -d /tmp/vada141

          (
            cd /tmp/vada141
            zip -qr "$GITHUB_WORKSPACE/$OUT/VADA_Don_Plugin_v1.4.1.rbz" vada_extension_cleaner.rb vada_extension_cleaner
          )

          unzip -t "$OUT/VADA_Don_Plugin_v1.4.1_source.zip"
          unzip -t "$OUT/VADA_Don_Plugin_v1.4.1.rbz"

      - name: Commit packages
        shell: bash
        run: |
          git config user.name "VADA Release Bot"
          git config user.email "assistant@vada.local"
          git add "02 - Dọn plugin rác/v1.4.1/VADA_Don_Plugin_v1.4.1.rbz" \
                  "02 - Dọn plugin rác/v1.4.1/VADA_Don_Plugin_v1.4.1_source.zip"
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Đóng gói Dọn Plugin VADA v1.4.1"
          git push
